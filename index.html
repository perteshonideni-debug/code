<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="CodePath is a focused, practical way to learn Python." />
    <title>CodePath — Learn with intention</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Automatically redirect to Vite dev server (port 5173) if opened via VS Code Live Server (port 5500)
      if (window.location.port === '5500') {
        window.location.replace('http://127.0.0.1:5173/' + window.location.hash);
      }
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot-screen">
        <div class="boot-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4.5 19L10 13.5L14 16.5L18.4 8.4"></path>
            <circle cx="19.3" cy="7.3" r="2.7" fill="currentColor" stroke="none"></circle>
            <circle cx="4.5" cy="19" r="1.4" fill="currentColor" stroke="none"></circle>
          </svg>
        </div>
        <p class="boot-copy">Loading CodePath…</p>
      </div>
    </div>
    <noscript>CodePath needs JavaScript enabled to load the learning experience.</noscript>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
